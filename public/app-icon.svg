<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#14206b"/>
      <stop offset="55%" stop-color="#0e1645"/>
      <stop offset="100%" stop-color="#060b21"/>
    </linearGradient>
    <linearGradient id="gold" x1="120" y1="80" x2="400" y2="440">
      <stop offset="0%" stop-color="#f0d68a"/>
      <stop offset="45%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8f6f16"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
